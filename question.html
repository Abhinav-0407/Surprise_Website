<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff9fc">
    <title>A Little Question</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/question.css">
</head>
<body>
    <div class="background" aria-hidden="true"></div>
    <div class="glow glow-one" aria-hidden="true"></div>
    <div class="glow glow-two" aria-hidden="true"></div>

    <div class="floating-hearts" aria-hidden="true">
        <span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span>
        <span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span>
    </div>

    <main class="question-card" id="questionCard">
        <p class="eyebrow">A tiny question before the surprise</p>
        <h1>Are you excited for your surprise?</h1>
        <p class="subtitle">Choose wisely... there's only one right answer. ♡</p>

        <div class="button-area" id="buttonArea">
            <button class="choice-button yes-button" id="yesButton" type="button">
                Yes <span aria-hidden="true">♡</span>
            </button>
            <button class="choice-button no-button" id="noButton" type="button">
                No <span aria-hidden="true">🙃</span>
            </button>
        </div>

        <p class="tiny-note" id="tinyNote" aria-live="polite">Go on, give it a try...</p>
    </main>

    <script src="js/question.js"></script>
</body>
</html>
