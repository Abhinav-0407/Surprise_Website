<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFF9FC">
    <title>Happy Birthday Zebaa ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/transition.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="intro" aria-label="Introduction">
        <h3 id="line1">Every story has a beginning...</h3>
        <h3 id="line2">Some people become memories...</h3>
        <h3 id="line3">Some become unforgettable...</h3>
    </div>

    <section id="hero">
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="petals" aria-hidden="true"></div>
        <div class="stars" aria-hidden="true"></div>

        <div class="hero-content">
            <p class="hero-subtitle">For My Shri Sakhi🫶</p>

            <h1 class="hero-title">HAPPY BIRTHDAY</h1>

            <div class="divider" aria-hidden="true">
                <span class="line"></span>
                <span class="diamond">✦</span>
                <span class="line"></span>
            </div>

            <h2 class="hero-name">Zeba❤️✨</h2>

            <p class="hero-description">
                May this birthday bring you endless happiness,
                unforgettable memories, beautiful adventures,
                and every smile your heart deserves.
            </p>

            <button id="startBtn" type="button">
                <span>Begin the Journey</span>
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
        </div>
    </section>

    <div id="transition" aria-hidden="true">
        <div class="transition-glow"></div>
        <div class="transition-text"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js"></script>
    <script src="js/transition.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
