<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FDECF4">
    <title>Your Surprise Is Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>
    <div class="background" aria-hidden="true"></div>
    <div class="soft-glow" aria-hidden="true"></div>
    <div class="petals" aria-hidden="true"></div>

    <main class="loader-container">
        <div class="heart-orbit" aria-hidden="true">
            <span class="orbit orbit-one"></span>
            <span class="orbit orbit-two"></span>
            <span class="loader-heart">♥</span>
        </div>

        <p class="eyebrow">A little something is on its way</p>
        <h1>Your surprise is loading...</h1>
        <p class="subtext">Just a moment. Something special is being prepared for you. ♡</p>

        <div class="loading-bar" role="progressbar" aria-label="Loading surprise" aria-valuemin="0" aria-valuemax="100">
            <div class="loading-progress"></div>
        </div>
        <p class="loading-caption">Please wait<span class="dots">...</span></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js"></script>
    <script src="js/loading.js"></script>
</body>
</html>
