<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff9fc">
    <title>Welcome</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="background" aria-hidden="true"></div>
    <div class="soft-glow glow-one" aria-hidden="true"></div>
    <div class="soft-glow glow-two" aria-hidden="true"></div>

    <div class="petals" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <main class="login-box">
        <h1>Welcome </h1>
        <p>Enter to continue</p>

        <div class="input-box">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                aria-label="Username"
            >
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                aria-label="Password"
            >
            <button class="toggle-password" id="togglePassword" type="button" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>

        <button class="login-button" id="loginBtn" type="button">Login</button>
        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
